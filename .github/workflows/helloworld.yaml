---
name: Hello World

on:
    push:
        branches:
        - main
    workflow_dispatch:

jobs:
    say-hello-inline-bash:
        runs-on: ubuntu-latest      
        steps:
            - name: Say Hello
              run: echo "Hello, Github Actions!"

    show-time:
        runs-on: ubuntu-latest     
        steps:
            - name: tell time
              run: echo "The time is $(date)"

    show-version:
        runs-on: ubuntu-latest
        needs: 
            - show-time
        steps:
            - name: show version
              run: echo "The linux version is $(lsb_release -a)"
    
    show-user:
        runs-on: ubuntu-latest     
        steps:
            - name: who is the user
              run: echo "The current user is $(whoami)"