---
name: Hello World

on:
    push:
        branches:
        - main
    workflow_dispatch:

jobs:
    say-hello-inline-bash:
        runs-on: ubuntu-latest      
        steps:
            - name: Say Hello
              run: 
                  echo "Hello, Github Actions!"
                  echo "What's new?"
    show-user:
        runs-on: ubuntu-latest  
        needs: 
            - say-hello-inline-bash           
        steps:
            - name: who is the user
              run: echo "The current user is $(whoami)"

    show-time:
        runs-on: ubuntu-latest 
        needs: 
            - show-user            
        steps:
            - name: tell time
              run: echo "The time is $(date)"

    show-version:
        runs-on: ubuntu-latest
        needs: 
            - show-user
        steps:
            - name: show version
              run: echo "The linux version is $(lsb_release -a)"
    
